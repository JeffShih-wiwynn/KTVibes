name: Linux installation smoke test
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare Linux tools and user service manager
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo systemctl start user@$(id -u).service
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Install, start, update and restart
        run: bash tools/ci/linux-install-smoke.sh
      - name: Collect service logs
        if: failure()
        run: journalctl --user -u ktvibes.service --no-pager > linux-service.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-install-failure
          path: linux-service.log
