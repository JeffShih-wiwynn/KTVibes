name: Python CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            uv sync --locked --extra cpu
          elif [[ "$RUNNER_OS" == Windows ]]; then
            # Production Windows installs use CUDA; CI exercises CPU behavior.
            uv sync --locked --no-install-package torch --no-install-package torchaudio
            uv pip install torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          else
            uv sync --locked
          fi

      - name: Run tests
        run: uv run --no-sync pytest
