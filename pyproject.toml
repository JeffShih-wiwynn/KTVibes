[project]
name = "ktvibes"
version = "0.7.0"
description = "At-home karaoke with a phone remote"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "yt-dlp[default]",
    "demucs==4.0.1",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "httpx",
    "qrcode",
    "soundfile",
    "pypinyin>=0.55.0",
    "g2pk2>=0.0.3",
    "python-mecab-ko>=1.3.7",
    "cmudict>=1.1.3",
    "certifi>=2026.7.22",
    "pykakasi>=2.3.0",
    "tojyutping>=3.2.0",
]

[project.scripts]
ktvibes = "ktvibes.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]
ui = ["pytest-playwright", "pytest-asyncio"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[project.optional-dependencies]
cpu = ["torch==2.7.1; sys_platform == 'linux'", "torchaudio==2.7.1; sys_platform == 'linux'"]
cuda = ["torch==2.7.1; sys_platform == 'linux'", "torchaudio==2.7.1; sys_platform == 'linux'"]
xpu = ["torch==2.7.1; sys_platform == 'linux'", "torchaudio==2.7.1; sys_platform == 'linux'", "pytorch-triton-xpu==3.3.1; sys_platform == 'linux'"]

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "cuda"}, {extra = "xpu"}]]

[tool.uv.sources]
pytorch-triton-xpu = { index = "pytorch-xpu" }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'linux'" },
  { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'linux'" },
  { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
